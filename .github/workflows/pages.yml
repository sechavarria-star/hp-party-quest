name: Publish verified frontend
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: party-quest-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Validate configured backend
        run: |
          API_URL=$(node -e "const fs=require('fs'),vm=require('vm');const c={window:{}};vm.runInNewContext(fs.readFileSync('frontend/config.js','utf8'),c);console.log(c.window.HPQ_CONFIG.API_URL)")
          node scripts/bootstrap-backend.mjs "$API_URL" "https://sechavarria-star.github.io/hp-party-quest/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq "[.artifacts[] | select(.name == \"$ARTIFACT_NAME\")] | length")
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 3
          done
          echo "The uploaded Pages artifact is not visible yet." >&2
          exit 1
      - uses: actions/deploy-pages@v4
        id: deploy
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
