name: Publish verified frontend
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: party-quest-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_by_id.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Validate configured backend
        run: |
          API_URL=$(node -e "const fs=require('fs'),vm=require('vm');const c={window:{}};vm.runInNewContext(fs.readFileSync('frontend/config.js','utf8'),c);console.log(c.window.HPQ_CONFIG.API_URL)")
          node scripts/bootstrap-backend.mjs "$API_URL" "https://sechavarria-star.github.io/hp-party-quest/"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        id: pages_artifact
        with:
          path: frontend
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq "[.artifacts[] | select(.name == \"$ARTIFACT_NAME\")] | length")
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 3
          done
          echo "The uploaded Pages artifact is not visible yet." >&2
          exit 1
      - uses: actions/deploy-pages@v4
        id: deploy
        continue-on-error: true
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy uploaded artifact by ID if metadata lookup failed
        if: steps.deploy.outcome == 'failure'
        id: deploy_by_id
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        with:
          script: |
            const artifactId = process.env.PAGES_ARTIFACT_ID;
            if (!/^\d+$/.test(artifactId || '')) throw new Error('Missing uploaded Pages artifact ID');
            const oidc = await core.getIDToken();
            core.setSecret(oidc);
            const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...context.repo, artifact_id: Number(artifactId), pages_build_version: context.sha, oidc_token: oidc
            });
            const deploymentId = data.id || data.status_url?.split('/').pop();
            if (!deploymentId) throw new Error('Missing Pages deployment ID');
            for (let attempt = 0; attempt < 120; attempt++) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              const { data: status } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deploymentId}', { ...context.repo, deploymentId });
              if (status.status === 'succeed') {
                core.setOutput('page_url', data.page_url || 'https://sechavarria-star.github.io/hp-party-quest/');
                return;
              }
              if (['deployment_failed', 'deployment_perms_error', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'].includes(status.status)) throw new Error('Pages: ' + status.status);
            }
            throw new Error('Pages deployment did not finish within 10 minutes');
